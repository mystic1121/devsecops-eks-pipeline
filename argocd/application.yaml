apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turbo-task-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mystic1121/devsecops-eks-pipeline.git'
    targetRevision: HEAD
    path: 'k8s'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: turbo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true